const COEFFS = {
  b0_1: 1.53512485958697,
  b1_1: -2.69169618940638,
  b2_1: 1.19839281085285,
  a1_1: -1.69065929318241,
  a2_1: 0.73248077421585,
  b0_2: 1,
  b1_2: -2,
  b2_2: 1,
  a1_2: -1.99004745483398,
  a2_2: 0.99007225036621,
};

function biquadCascade(input, b0_1,b1_1,b2_1,a1_1,a2_1, b0_2,b1_2,b2_2,a1_2,a2_2) {
  let x1=0,x2=0,y1=0,y2=0;
  const tmp = new Float32Array(input.length);
  for (let n=0;n<input.length;n++) {
    const x0 = input[n];
    const y0 = b0_1*x0 + b1_1*x1 + b2_1*x2 - a1_1*y1 - a2_1*y2;
    tmp[n]=y0;
    x2=x1; x1=x0;
    y2=y1; y1=y0;
  }
  // stage2
  x1=0; x2=0; y1=0; y2=0;
  const out = new Float32Array(input.length);
  for (let n=0;n<input.length;n++) {
    const x0 = tmp[n];
    const y0 = b0_2*x0 + b1_2*x1 + b2_2*x2 - a1_2*y1 - a2_2*y2;
    out[n]=y0;
    x2=x1; x1=x0;
    y2=y1; y1=y0;
  }
  return out;
}

function computeTruePeak(channels) {
  let max = 0;
  for (let c=0;c<channels.length;c++) {
    const data = channels[c];
    // include original peaks
    for (let i=0;i<data.length;i++) {
      const abs = Math.abs(data[i]);
      if (abs>max) max=abs;
    }
    // 4x linear oversample to catch intersample
    for (let i=0;i<data.length-1;i++) {
      const a = data[i];
      const b = data[i+1];
      // 4x: t=0.25,0.5,0.75
      for (let k=1;k<4;k++) {
        const t = k/4;
        const v = a*(1-t)+b*t;
        const av = Math.abs(v);
        if (av>max) max=av;
      }
    }
  }
  return max;
}
function computeSamplePeak(channels) {
  let max=0;
  for (let c=0;c<channels.length;c++) {
    const d=channels[c];
    for (let i=0;i<d.length;i++) {
      const a=Math.abs(d[i]);
      if(a>max) max=a;
    }
  }
  return max;
}

self.onmessage = (e) => {
  const { channels, sampleRate, duration } = e.data;
  const numCh = channels.length;
  const len = channels[0].length;

  // filtering
  const filtered = [];
  for (let c=0;c<numCh;c++) {
    const f = biquadCascade(channels[c],
      COEFFS.b0_1, COEFFS.b1_1, COEFFS.b2_1, COEFFS.a1_1, COEFFS.a2_1,
      COEFFS.b0_2, COEFFS.b1_2, COEFFS.b2_2, COEFFS.a1_2, COEFFS.a2_2
    );
    filtered.push(f);
  }

  const blockSize = Math.round(0.4*sampleRate); // 19200 @48k
  const hop = Math.round(0.1*sampleRate); // 4800
  const blockSizeShort = Math.round(3.0*sampleRate); // 144000

  const numBlocks = Math.max(1, Math.floor((len - blockSize)/hop)+1);
  const z = new Float64Array(numBlocks);
  const loudMomentary = new Float64Array(numBlocks);

  for (let j=0;j<numBlocks;j++) {
    const start = j*hop;
    let sumPow = 0;
    for (let c=0;c<numCh;c++) {
      const f = filtered[c];
      let sumSq=0;
      const end = Math.min(start+blockSize, f.length);
      const count = end-start;
      for (let k=start;k<end;k++) {
        const s = f[k];
        sumSq += s*s;
      }
      const mean = count>0 ? sumSq / count : 0;
      sumPow += mean; // G=1
    }
    z[j]=sumPow;
    loudMomentary[j] = sumPow>0 ? -0.691 + 10*Math.log10(sumPow) : -Infinity;
  }

  // Short term
  const numBlocksShort = Math.max(1, Math.floor((len - blockSizeShort)/hop)+1);
  const zShort = new Float64Array(numBlocksShort);
  const loudShort = new Float64Array(numBlocksShort);
  for (let j=0;j<numBlocksShort;j++) {
    const start = j*hop;
    let sumPow=0;
    for (let c=0;c<numCh;c++) {
      const f = filtered[c];
      let sumSq=0;
      const end = Math.min(start+blockSizeShort, f.length);
      const count = end-start;
      for (let k=start;k<end;k++) {
        const s = f[k];
        sumSq += s*s;
      }
      const mean = count>0 ? sumSq / count : 0;
      sumPow += mean;
    }
    zShort[j]=sumPow;
    loudShort[j]= sumPow>0 ? -0.691 + 10*Math.log10(sumPow) : -Infinity;
  }

  // Integrated loudness - absolute gate -70
  let absGatedZ = [];
  for (let j=0;j<numBlocks;j++) {
    if (loudMomentary[j] > -70) absGatedZ.push(z[j]);
  }
  let integrated = -Infinity;
  let relativeGate = -70;
  let finalGatedZ = [];
  if (absGatedZ.length>0) {
    let sum=0;
    for (let v of absGatedZ) sum+=v;
    const meanAbs = sum/absGatedZ.length;
    const loudAbs = -0.691 + 10*Math.log10(meanAbs);
    relativeGate = loudAbs - 10;
    const relThresh = Math.pow(10, (relativeGate+0.691)/10);
    for (let j=0;j<numBlocks;j++) {
      if (z[j] > relThresh) finalGatedZ.push(z[j]);
    }
    if (finalGatedZ.length>0) {
      let sum2=0;
      for (let v of finalGatedZ) sum2+=v;
      const meanFinal = sum2/finalGatedZ.length;
      integrated = -0.691 + 10*Math.log10(meanFinal);
    }
  }

  // Max momentary / short
  let momMax = -Infinity;
  for (let v of loudMomentary) if (v>momMax) momMax=v;
  let shortMax = -Infinity;
  for (let v of loudShort) if (v>shortMax) shortMax=v;

  // True peak / sample peak
  const truePeakLin = computeTruePeak(channels);
  const samplePeakLin = computeSamplePeak(channels);
  const truePeakDb = truePeakLin>0 ? 20*Math.log10(truePeakLin) : -Infinity;
  const samplePeakDb = samplePeakLin>0 ? 20*Math.log10(samplePeakLin) : -Infinity;

  // LRA - EBU Tech 3342
  let lra = 0;
  let lraRelative = -70;
  let absGatedShort = [];
  let absGatedShortZ = [];
  for (let j=0;j<numBlocksShort;j++) {
    if (loudShort[j] > -70) {
      absGatedShort.push(loudShort[j]);
      absGatedShortZ.push(zShort[j]);
    }
  }
  if (absGatedShort.length>0) {
    let sum=0;
    for (let v of absGatedShortZ) sum+=v;
    const meanAbsShort = sum/absGatedShortZ.length;
    const loudAbsShort = -0.691 + 10*Math.log10(meanAbsShort);
    lraRelative = loudAbsShort - 20;
    const relThreshLRA = Math.pow(10, (lraRelative+0.691)/10);
    let relGatedShort = [];
    for (let j=0;j<numBlocksShort;j++) {
      if (zShort[j] > relThreshLRA && loudShort[j] > -70) relGatedShort.push(loudShort[j]);
    }
    if (relGatedShort.length>0) {
      relGatedShort.sort((a,b)=>a-b);
      const n = relGatedShort.length;
      const idx10 = Math.floor(n*0.1);
      const idx95 = Math.floor(n*0.95);
      const p10 = relGatedShort[Math.min(idx10, n-1)];
      const p95 = relGatedShort[Math.min(idx95, n-1)];
      lra = p95 - p10;
      if (!isFinite(lra) || lra<0) lra=0;
    }

  self.postMessage({
    integrated,
    truePeak: truePeakDb,
    samplePeak: samplePeakDb,
    shortMax,
    momMax,
    lra,
    plr,
    psr,
    relativeGate,
    lraRelative,
    numBlocks,
    shortValues: Array.from(loudShort).slice(0, 2000),
    momValues: Array.from(loudMomentary).slice(0, 2000),
